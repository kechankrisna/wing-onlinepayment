name: dart_wing
description: Wing Bank online payment (Web SDK v2) client for Dart and Flutter. Authorize a payment, open Wing's checkout page, inquire transactions, and decrypt payment callbacks.
version: 1.0.0
repository: https://github.com/kechankrisna/wing-onlinepayment/tree/main/dart
issue_tracker: https://github.com/kechankrisna/wing-onlinepayment/issues
topics:
  - payment
  - wing
  - cambodia
  - checkout

environment:
  sdk: ^3.9.0

dependencies:
  crypto: ^3.0.3
  dio: ^5.4.0
  json_annotation: ^4.12.0
  pointycastle: ^4.0.0

dev_dependencies:
  build_runner: ^2.16.1
  dotenv: ^4.1.0
  json_serializable: ^6.14.1
  lints: ^6.0.0
  test: ^1.26.0
