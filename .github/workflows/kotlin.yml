name: kotlin

on:
  push:
    branches: [main]
    paths: ['kotlin/**', 'spec/**', '.github/workflows/kotlin.yml']
  pull_request:
    paths: ['kotlin/**', 'spec/**', '.github/workflows/kotlin.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: kotlin

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the library is compiled for 17; the tests also run on 21
        test-jdk: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build (compile with -Werror, ktlint, offline tests with the known answers)
        run: ./gradlew build -PtestJdk=${{ matrix.test-jdk }}

      # Optional: set the repository secret WING_UAT_ENV to the
      # content of a Wing UAT .env (see kotlin/.env.example).
      - name: UAT integration tests
        env:
          UAT_ENV: ${{ secrets.WING_UAT_ENV }}
        if: env.UAT_ENV != '' && matrix.test-jdk == '17'
        run: |
          printf '%s\n' "$UAT_ENV" > .env
          ./gradlew integrationTest

      - name: Publication builds (no signing, nothing uploaded)
        if: matrix.test-jdk == '17'
        run: ./gradlew publishToMavenLocal
