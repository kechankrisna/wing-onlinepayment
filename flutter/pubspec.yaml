name: flutter_wing_checkout
description: >-
  Flutter checkout for Wing Bank online payment, built on dart_wing: opens
  Wing's payment page in a web view and reports success or cancellation.
version: 1.0.0
repository: https://github.com/kechankrisna/wing-onlinepayment/tree/main/flutter
issue_tracker: https://github.com/kechankrisna/wing-onlinepayment/issues
topics: [wing, payment, checkout, cambodia]

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  dart_wing: ^1.0.0
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
